name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  gitleaks:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, not a shallow PR-diff scope (this stage's original Q2
          # intent) — a shallow fetch-depth only works for a single-commit PR;
          # gitleaks-action needs the commit *before* the PR's first commit to
          # resolve its scan range, which a 2+-commit PR won't have fetched at
          # any fixed shallow depth (found via a real CI run on a 2-commit PR:
          # "ambiguous argument ... unknown revision or path not in the working
          # tree"). Cheap for a repo this size.
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint-typecheck-test:
    name: Lint, typecheck, unit/component tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Lint
        run: npx eslint . --ext .ts,.tsx
      - name: Type check
        run: npx tsc --noEmit
      - name: Unit/component tests with coverage
        run: npx vitest run --coverage --coverage.thresholds.lines=80

  codeql:
    name: SAST (CodeQL)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript # default setup, this stage's Q1
      - uses: github/codeql-action/analyze@v3

  dependency-audit:
    name: Dependency scan (npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  e2e-smoke:
    name: E2E happy-path (post-merge Gate 2)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [lint-typecheck-test]
    # The two values below live in the repo's "Keys" GitHub Environment —
    # a job only gets access to an Environment's secrets/variables once it
    # names that environment here; without this line both resolve empty
    # even though they're set (found via a real CI run: the job's own env
    # block printed both as blank).
    environment: Keys
    env:
      # Client-safe, public values (README.md "Environment variables") —
      # meant to be embedded in the browser bundle, so repository
      # Variables is the more conventional place for them (unlike a real
      # secret), but they work the same functionally from Environment
      # secrets — read from either `vars` or `secrets` so this isn't
      # sensitive to which of the two a first-time setup used.
      # playwright.config.ts's webServer runs `npm run build && npm run
      # start`, which needs these at build time to talk to the real
      # Supabase project.
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps
      - name: Run the full browser matrix (Chromium/Firefox/WebKit + mobile-chrome/mobile-safari)
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
