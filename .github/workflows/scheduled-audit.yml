name: Scheduled dependency audit

on:
  schedule:
    - cron: '0 6 * * 1' # weekly, Monday 06:00 UTC (team.md: "a scheduled weekly job")
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Weekly npm audit (production dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
